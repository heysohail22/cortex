[project]
name = "backend"
version = "0.1.0"
description = "Cortex — Multi-Agent RAG Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "python-multipart>=0.0.20",
    # LLM & Agents
    "langchain>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    # Vector store (Supabase pgvector)
    "supabase>=2.0.0",
    # Cloud embeddings (Google Gemini text-embedding-004)
    "google-genai>=1.0.0",
    # Web search
    "tavily-python>=0.5.0",
    # Document parsing
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "langchain-text-splitters>=1.1.2",
    "docx2txt>=0.9",
    "langchain-google-genai>=4.2.5",
    "grandalf>=0.8",
    "langgraph-cli[inmem]>=0.4.31",
    # Evaluation framework
    "ragas>=0.2.0",
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "typesafe-sdk>=0.7.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
